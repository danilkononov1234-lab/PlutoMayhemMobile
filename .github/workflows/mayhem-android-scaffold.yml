name: Mayhem Android scaffold
on:
  workflow_dispatch:
  push:
    branches: [mayhem-android-phase1]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Build debug APK
        working-directory: mayhem-android
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: mayhem-android-scaffold-debug-apk
          path: mayhem-android/app/build/outputs/apk/debug/*.apk
