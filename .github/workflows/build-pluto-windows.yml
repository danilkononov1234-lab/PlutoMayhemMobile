name: Build Pluto Mayhem Windows EXE
on:
  push:
    branches: [pluto-mayhem-windows]
  workflow_dispatch:

jobs:
  windows-x64:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - name: Extract uploaded sources
        shell: pwsh
        run: |
          $zip = "cardze-mayhem-port-windows.zip"
          if (!(Test-Path $zip)) { throw "Missing $zip in branch" }
          Expand-Archive -LiteralPath $zip -DestinationPath extracted -Force
          if (!(Test-Path "extracted/cardze-mayhem-port-main/CMakeLists.txt")) { throw "Expected project directory missing" }
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git make
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-SDL2
            mingw-w64-ucrt-x86_64-SDL2_image
            mingw-w64-ucrt-x86_64-rtl-sdr
            mingw-w64-ucrt-x86_64-libiio
            mingw-w64-ucrt-x86_64-binutils
            file
      - name: Fetch pinned upstream Mayhem firmware
        working-directory: extracted/cardze-mayhem-port-main
        run: |
          git config --global core.longpaths true
          git clone https://github.com/portapack-mayhem/mayhem-firmware.git third_party/mayhem-firmware
          git -C third_party/mayhem-firmware checkout 77798cb09f227de5c58dea48899ddb7448b44a07
          git -C third_party/mayhem-firmware submodule update --init --recursive
      - name: Configure
        working-directory: extracted/cardze-mayhem-port-main
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Compile
        working-directory: extracted/cardze-mayhem-port-main
        run: cmake --build build -j"$(nproc)"
      - name: Inspect PE section layout and linker
        working-directory: extracted/cardze-mayhem-port-main
        run: |
          echo "Compiler:"
          command -v c++ && c++ --version | head -2
          echo "PE headers:"
          objdump -f build/mayhem-desktop.exe
          objdump -h build/mayhem-desktop.exe
          echo "Link command:"
          if test -f build/build.ninja; then grep -A 12 -m 1 'mayhem-desktop.exe:' build/build.ninja || true; fi
          echo "PE summary:"
          python -c "import struct,pathlib; b=pathlib.Path('build/mayhem-desktop.exe').read_bytes(); o=struct.unpack_from('<I',b,0x3c)[0]; n=struct.unpack_from('<H',b,o+6)[0]; print('PE sections:',n); print('PE signature:',repr(b[o:o+4])); print('Section count exceeds traditional 96-section loader limit:',n>96)"
      - name: Validate Windows executable loader
        shell: pwsh
        working-directory: extracted/cardze-mayhem-port-main
        run: |
          $exe = (Resolve-Path "build/mayhem-desktop.exe").Path
          $bytes = [System.IO.File]::ReadAllBytes($exe)
          if ($bytes.Length -lt 1024 -or $bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw "Missing MZ header" }
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
          if ($peOffset -lt 64 -or $peOffset + 26 -ge $bytes.Length) { throw "Invalid PE offset" }
          if ([Text.Encoding]::ASCII.GetString($bytes, $peOffset, 4) -ne "PE`0`0") { throw "Missing PE signature" }
          $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
          $magic = [BitConverter]::ToUInt16($bytes, $peOffset + 24)
          Write-Host ("Machine: 0x{0:X4}; Optional header: 0x{1:X4}; bytes: {2}" -f $machine, $magic, $bytes.Length)
          if ($machine -ne 0x8664 -or $magic -ne 0x20B) { throw "Not Windows x64 PE32+" }
          try {
            $p = Start-Process -FilePath $exe -WorkingDirectory (Split-Path $exe) -PassThru -ErrorAction Stop
            Start-Sleep -Seconds 3
            $p.Refresh()
            if (!$p.HasExited) { Stop-Process -Id $p.Id -Force; Write-Host "Windows loader accepted executable (process started)." }
            else { Write-Host "Process exited with code $($p.ExitCode)"; if ($p.ExitCode -eq -1073741701) { throw "Bad EXE format (0xC000007B)" } }
          } catch {
            throw "Windows could not launch compiled EXE: $($_.Exception.Message)"
          }
      - name: Package
        working-directory: extracted/cardze-mayhem-port-main
        run: |
          python ../../tools/package_windows.py
      - name: Upload EXE and DLLs
        uses: actions/upload-artifact@v4
        with:
          name: mayhem-desktop-windows-x64
          path: extracted/cardze-mayhem-port-main/dist/Mayhem Desktop/
          if-no-files-found: error
